<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Smart Hospital</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
    :root {
      --bg: #F4F7F8; --surface: #fff; --border: #E1E7EA;
      --ink: #0F2027; --subtle: #64777E;
      --accent: #0E6E6E; --accent-soft: #E4F1F1;
      --danger: #C22A2A; --danger-soft: #FBE9E9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; background: var(--bg);
      font-family: 'IBM Plex Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 40px 36px;
      width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
    }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #17864F;
      box-shadow: 0 0 0 0 rgba(23,134,79,.5);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(23,134,79,.45); }
      70%  { box-shadow: 0 0 0 8px rgba(23,134,79,0); }
      100% { box-shadow: 0 0 0 0 rgba(23,134,79,0); }
    }
    .logo h1 {
      font-family: 'Space Grotesk'; font-size: 17px; font-weight: 700;
      color: var(--ink);
    }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--subtle); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 6px;
    }
    input {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1px solid var(--border); border-radius: 7px;
      background: #FAFBFB; color: var(--ink);
      font-family: 'IBM Plex Mono'; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    .field { margin-bottom: 16px; }
    .btn {
      width: 100%; padding: 11px; margin-top: 8px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 7px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: 'IBM Plex Sans';
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .error {
      margin-top: 12px; padding: 9px 12px;
      background: var(--danger-soft); border: 1px solid #F1C8C8;
      border-radius: 7px; color: var(--danger);
      font-size: 13px; display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-dot"></span>
      <h1>Smart Hospital — Đăng nhập</h1>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="username" required />
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button class="btn" type="submit" id="submitBtn">Đăng nhập</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang đăng nhập...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include'
        });
        const data = await res.json();
        if (data.status === 'success') {
          // Lưu token cho Map UI dùng cross-origin
          localStorage.setItem('dth_token', data.token);
          window.location.href = '/dashboard';
        } else {
          throw new Error(data.message);
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Đăng nhập thất bại';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
