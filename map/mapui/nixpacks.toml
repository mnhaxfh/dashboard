[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

# Tắt Caddy phase để vite preview tự serve thẳng
[phases.caddy]
nixPkgs = []
cmds = []

[start]
cmd = "node_modules/.bin/vite preview --host 0.0.0.0 --port ${PORT:-4173}"

[staticAssets]
staticDir = ""
