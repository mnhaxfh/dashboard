<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng điều khiển vận hành khám bệnh — Bệnh viện Nam học & Hiếm muộn</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg: #F4F7F8;
  --surface: #FFFFFF;
  --border: #E1E7EA;
  --ink: #0F2027;
  --subtle: #64777E;
  --accent: #0E6E6E;
  --accent-soft: #E4F1F1;
  --success: #17864F;
  --success-soft: #E6F4EC;
  --warning: #B8720A;
  --warning-soft: #FBF0DD;
  --danger: #C22A2A;
  --danger-soft: #FBE9E9;
  --neutral-soft: #EEF2F3;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  padding:28px;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.display{font-family:'Space Grotesk', sans-serif;}

.wrap{max-width:1180px;margin:0 auto;}

/* ---- header ---- */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:22px;
}
.topbar h1{
  font-family:'Space Grotesk', sans-serif;
  font-size:20px;font-weight:700;letter-spacing:0.2px;margin:0;
  display:flex;align-items:center;gap:10px;
}
.dot-pulse{
  width:9px;height:9px;border-radius:50%;background:var(--success);
  box-shadow:0 0 0 0 rgba(23,134,79,0.5);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(23,134,79,0.45);}
  70%{box-shadow:0 0 0 8px rgba(23,134,79,0);}
  100%{box-shadow:0 0 0 0 rgba(23,134,79,0);}
}
.refresh-tag{
  font-size:12px;color:var(--subtle);
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  padding:6px 12px;border-radius:20px;
}
.refresh-tag.peak{color:var(--danger);border-color:#F1C8C8;background:var(--danger-soft);}
.refresh-tag.mid{color:var(--warning);border-color:#F1DDB0;background:var(--warning-soft);}
.refresh-tag.low{color:var(--success);border-color:#C7E6D5;background:var(--success-soft);}

/* ---- KPI row ---- */
.kpi-row{
  display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:14px;margin-bottom:14px;
}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:16px 18px;
}
.kpi-label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--subtle);font-weight:600;margin-bottom:8px;
}
.kpi-value{
  font-family:'Space Grotesk', sans-serif;
  font-size:32px;font-weight:700;line-height:1;
}
.kpi-sub{font-size:12px;color:var(--subtle);margin-top:6px;}

/* overload card w/ room-block signature grid */
.overload-card .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;}
.overload-pct{font-family:'Space Grotesk';font-size:32px;font-weight:700;}
.overload-pct.ok{color:var(--success);}
.overload-pct.warn{color:var(--danger);}
.room-grid{
  display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px;
}
.room-cell{
  aspect-ratio:1/1;border-radius:2px;background:var(--neutral-soft);
}
.room-cell.busy{background:var(--success);}
.room-cell.over{background:var(--danger);}
.room-cell.idle{background:var(--neutral-soft);}
.room-cell.closed{background:repeating-linear-gradient(45deg,#DCE2E4,#DCE2E4 3px,#EAEEEF 3px,#EAEEEF 6px);}

/* wait time strip */
.wait-strip{
  display:flex;align-items:center;gap:18px;margin-bottom:18px;
}
.wait-strip .card{flex:1;display:flex;align-items:center;justify-content:space-between;}
.spark{display:flex;align-items:flex-end;gap:2px;height:32px;}
.spark div{width:5px;background:var(--accent);border-radius:1px;opacity:0.85;}

/* ---- two column panels ---- */
.panels{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.panel-head h2{
  font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0;
  text-transform:uppercase;letter-spacing:0.06em;
}
.panel-head .count{
  font-family:'IBM Plex Mono';font-size:12px;color:var(--subtle);
}
.list{max-height:520px;overflow-y:auto;}

/* row (patient or room) */
.row{
  border-bottom:1px solid var(--border);
}
.row-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;cursor:pointer;
}
.row-head:hover{background:var(--neutral-soft);}
.row-id{
  font-family:'IBM Plex Mono';font-weight:600;font-size:13px;
}
.row-meta{font-size:12px;color:var(--subtle);}
.chip{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  white-space:nowrap;
}
.chip.done{background:var(--success-soft);color:var(--success);}
.chip.waiting{background:var(--warning-soft);color:var(--warning);}
.chip.progress{background:var(--accent-soft);color:var(--accent);}
.chip.none{background:var(--neutral-soft);color:var(--subtle);}
.chip.over{background:var(--danger-soft);color:var(--danger);}
.chip.closed{background:var(--neutral-soft);color:var(--subtle);}

.row-detail{
  display:none;background:var(--neutral-soft);padding:14px 18px 16px 18px;
}
.row-detail.open{display:block;}
.detail-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;
}
.detail-line:last-child{border-bottom:none;}
.detail-stat-row{display:flex;gap:16px;margin-bottom:10px;}
.detail-stat{font-size:12px;color:var(--subtle);}
.detail-stat b{
  display:block;font-family:'Space Grotesk';font-size:18px;color:var(--ink);
  font-weight:700;
}
.id-group{margin-top:8px;}
.id-group-label{font-size:11px;color:var(--subtle);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
.id-tags{display:flex;flex-wrap:wrap;gap:6px;}
.id-tag{
  font-family:'IBM Plex Mono';font-size:11px;font-weight:600;
  background:var(--surface);border:1px solid var(--border);color:var(--ink);
  padding:3px 8px;border-radius:6px;
}
.id-tag.prog{border-color:#BFDCDC;color:var(--accent);background:var(--accent-soft);}
.id-empty{font-size:12px;color:var(--subtle);font-style:italic;}
.caret{transition:transform 0.15s ease;color:var(--subtle);font-size:11px;}
.row-head.expanded .caret{transform:rotate(90deg);}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1><span class="dot-pulse"></span>Nam học & Hiếm muộn — Vận hành Realtime</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="refresh-tag" id="loadBadge">— · —</span>
      <div class="refresh-tag">Cập nhật <span class="mono" id="refreshSecs">3</span>s trước · tự động mỗi 5s</div>
    </div>
  </div>

  <div class="kpi-row">
    <div class="card">
      <div class="kpi-label">Tổng bệnh nhân hiện tại</div>
      <div class="kpi-value mono" id="kpiTotalPatients">—</div>
      <div class="kpi-sub" id="kpiTotalPatientsSub">—</div>
    </div>
    <div class="card">
      <div class="kpi-label">Bệnh nhân đang khám</div>
      <div class="kpi-value mono" id="kpiPatients">—</div>
      <div class="kpi-sub" id="kpiPatientsSub">—</div>
    </div>
    <div class="card">
      <div class="kpi-label">Phòng đang hoạt động</div>
      <div class="kpi-value mono" id="kpiRooms">—</div>
      <div class="kpi-sub" id="kpiRoomsSub">—</div>
    </div>
    <div class="card overload-card">
      <div class="kpi-top">
        <div>
          <div class="kpi-label">Tỷ lệ quá tải</div>
          <div class="overload-pct mono" id="kpiOverload">—</div>
        </div>
        <div class="kpi-sub" id="kpiOverloadSub" style="text-align:right;">—</div>
      </div>
      <div class="room-grid" id="roomGrid"></div>
    </div>
  </div>

  <div class="wait-strip">
    <div class="card">
      <div>
        <div class="kpi-label">Thời gian chờ trung bình hiện tại</div>
        <div class="kpi-value mono" id="kpiWait">—</div>
      </div>
      <div class="spark" id="waitSpark"></div>
    </div>
  </div>

  <div class="panels">
    <div class="card" style="padding:0;">
      <div class="panel-head">
        <h2>Bệnh nhân</h2>
        <span class="count mono" id="patientCount">0 mã</span>
      </div>
      <div class="list" id="patientList"></div>
    </div>

    <div class="card" style="padding:0;">
      <div class="panel-head">
        <h2>Phòng khám</h2>
        <span class="count mono" id="roomCount">0 phòng</span>
      </div>
      <div class="list" id="roomList"></div>
    </div>
  </div>

</div>

<script>
const ROOM_NAMES = ["Khám nam khoa","Xét nghiệm tinh dịch đồ","Siêu âm đầu dò","Khám hiếm muộn nữ",
  "Nội tiết sinh sản","Siêu âm nang noãn","Chọc hút noãn (OPU)","Chuyển phôi (ET)",
  "Trữ đông phôi & tinh trùng","IUI","Vi phẫu nam khoa","Tư vấn di truyền","Xét nghiệm nội tiết","Khám tổng quát"];
// Ngưỡng cường độ (0–1) để phòng mở cửa. 0 = phòng thiết yếu, luôn mở.
const ROOM_MIN_INTENSITY = [0, 0, 0.15, 0, 0.15, 0.25, 0.45, 0.45, 0.35, 0.3, 0.5, 0.3, 0.15, 0];
const STATUS = { DONE:"done", WAIT:"waiting", PROG:"progress", NONE:"none" };
const STATUS_LABEL = { done:"Đã xong", waiting:"Chờ kết quả", progress:"Đang khám", none:"Chưa khám" };

let rooms = ROOM_NAMES.map((name,i)=>{
  const slots = 4 + (i%3)*2;
  return { id:"P"+(101+i), name, slots, minIntensity: ROOM_MIN_INTENSITY[i] };
});

let patientIdCounter = 1014;

function createPatient(idNum, forceEarlyStage, roomPool){
  const pool = (roomPool && roomPool.length) ? roomPool : rooms;
  // Mọi bệnh nhân đều phải qua khám sơ bộ (nam khoa hoặc hiếm muộn nữ) trước tiên -
  // đúng quy trình thực tế, và tạo điểm nghẽn ở 2 phòng nhỏ này khi đông bệnh nhân.
  const triagePool = pool.filter(r=> r.id==="P101" || r.id==="P104");
  const triage = triagePool.length ? triagePool[Math.floor(Math.random()*triagePool.length)] : pool[0];
  const restPool = pool.filter(r=> r.id !== triage.id);
  const extraCount = Math.min(restPool.length, 1 + Math.floor(Math.random()*3));
  const chosenExtra = [...restPool].sort(()=>0.5-Math.random()).slice(0, extraCount);
  const chosen = [triage, ...chosenExtra];
  const roomCount = chosen.length;
  const path = chosen.map((r,idx)=>{
    let st;
    if(forceEarlyStage){
      st = STATUS.NONE;
    } else if(idx < roomCount-1){
      st = Math.random()>0.3 ? STATUS.DONE : STATUS.WAIT;
    } else {
      st = [STATUS.PROG, STATUS.WAIT, STATUS.NONE][Math.floor(Math.random()*3)];
    }
    return { roomId:r.id, roomName:r.name, status: st };
  });
  return { id:"BN"+idNum, name:"Bệnh nhân "+idNum, path };
}

let patients = Array.from({length:14},(_,i)=> createPatient(1000+i));

let waitHistory = Array.from({length:16},()=> 8+Math.random()*10);
let secsSinceRefresh = 0;

// Giờ mô phỏng: khung hoạt động 06:00–20:00, mỗi tick nhảy thêm 18 phút mô phỏng.
let simMinutes = 6*60;
const DAY_START = 6*60, DAY_END = 20*60;

function gauss(t, peak, sigma){
  return Math.exp(-Math.pow(t-peak,2)/(2*sigma*sigma));
}

function loadIntensity(t){
  // 2 khung cao điểm: ~9h sáng và ~15h30 chiều
  const morning = gauss(t, 9*60, 70);
  const afternoon = gauss(t, 15.5*60, 70);
  return Math.min(1, Math.max(morning, afternoon) + 0.08);
}

function formatClock(t){
  const h = Math.floor(t/60)%24, m = Math.floor(t%60);
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0');
}

function updateLoadBadge(intensity){
  const badge = document.getElementById('loadBadge');
  let cls, label;
  if(intensity > 0.65){ cls="peak"; label="Cao điểm"; }
  else if(intensity > 0.35){ cls="mid"; label="Bình thường"; }
  else { cls="low"; label="Thấp điểm"; }
  badge.className = "refresh-tag "+cls;
  badge.textContent = formatClock(simMinutes)+" · "+label;
}

let currentIntensity = 0.1;

function isOverloaded(r){
  // Phòng có nhiều slot (sức chứa lớn) thì chỉ tính quá tải khi số người chờ gấp đôi số slot trở lên.
  const multiplier = r.slots >= 8 ? 2 : 1;
  return r.waiting > r.slots * multiplier;
}

// Số người đang xếp hàng chờ vào 1 phòng = số bệnh nhân có bước khám tại phòng đó
// còn ở trạng thái "Chưa khám". Khi bệnh nhân được gọi vào khám (chuyển sang "Đang khám"),
// họ không còn tính là đang chờ nữa -> số chờ tự giảm.
function countWaitingForRoom(roomId){
  let count = 0;
  patients.forEach(p=>{
    p.path.forEach(s=>{
      if(s.roomId===roomId && s.status===STATUS.NONE) count++;
    });
  });
  return count;
}

function computeOverload(){
  return rooms.map(r=>{
    const isOpen = currentIntensity >= r.minIntensity;
    const waiting = isOpen ? countWaitingForRoom(r.id) : 0;
    return { ...r, waiting, isOpen, overloaded: isOpen && isOverloaded({...r, waiting}) };
  });
}

function render(){
  const roomsState = computeOverload();
  const overCount = roomsState.filter(r=>r.overloaded).length;
  const openRooms = roomsState.filter(r=>r.isOpen);
  const overPct = Math.round((overCount/Math.max(1,openRooms.length))*100);
  const activeRooms = openRooms.length;
  const patientsExamining = patients.filter(p=>p.path.some(s=>s.status===STATUS.PROG)).length;

  const waitingCount = patients.filter(p=>p.path.some(s=>s.status===STATUS.WAIT) && !p.path.some(s=>s.status===STATUS.PROG)).length;
  const notYetCount = patients.filter(p=>p.path.every(s=>s.status===STATUS.NONE)).length;

  document.getElementById('kpiTotalPatients').textContent = patients.length;
  document.getElementById('kpiTotalPatientsSub').textContent = "mã đang theo dõi trong hệ thống";

  document.getElementById('kpiPatients').textContent = patientsExamining;
  document.getElementById('kpiPatientsSub').textContent = waitingCount+" chờ kết quả · "+notYetCount+" chưa khám";
  document.getElementById('kpiRooms').textContent = activeRooms+" / "+roomsState.length;
  document.getElementById('kpiRoomsSub').textContent = "trên tổng số phòng khám";

  const overloadEl = document.getElementById('kpiOverload');
  overloadEl.textContent = overPct+"%";
  overloadEl.className = "overload-pct mono "+(overPct>=25?"warn":"ok");
  document.getElementById('kpiOverloadSub').textContent = overCount+" / "+openRooms.length+" phòng đang mở quá tải";

  const grid = document.getElementById('roomGrid');
  grid.innerHTML = "";
  roomsState.forEach(r=>{
    const cell = document.createElement('div');
    cell.className = "room-cell " + (!r.isOpen ? "closed" : (r.overloaded ? "over" : (r.waiting>0 ? "busy":"idle")));
    cell.title = r.name+": "+(r.isOpen ? (r.waiting+"/"+r.slots) : "đóng cửa");
    grid.appendChild(cell);
  });

  const avgWait = waitHistory[waitHistory.length-1];
  document.getElementById('kpiWait').textContent = avgWait.toFixed(0)+" phút";
  const spark = document.getElementById('waitSpark');
  spark.innerHTML = "";
  const max = Math.max(...waitHistory);
  waitHistory.forEach(v=>{
    const bar = document.createElement('div');
    bar.style.height = Math.max(3,(v/max)*32)+"px";
    spark.appendChild(bar);
  });

  document.getElementById('patientCount').textContent = patients.length+" mã";
  document.getElementById('roomCount').textContent = roomsState.length+" phòng";

  renderPatientList();
  renderRoomList(roomsState);
}

function statusChip(status){
  return `<span class="chip ${status}">${STATUS_LABEL[status]}</span>`;
}

function getPatientIdsForRoom(roomId, status){
  return patients.filter(p=> p.path.some(s=> s.roomId===roomId && s.status===status)).map(p=>p.id);
}

function renderPatientList(){
  const list = document.getElementById('patientList');
  const openIds = [...list.querySelectorAll('.row-detail.open')].map(el=>el.dataset.id);
  list.innerHTML = "";
  patients.forEach(p=>{
    const doneCount = p.path.filter(s=>s.status===STATUS.DONE).length;
    const row = document.createElement('div');
    row.className = "row";
    const isOpen = openIds.includes(p.id);
    row.innerHTML = `
      <div class="row-head ${isOpen?'expanded':''}" onclick="toggleRow(this)">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="caret">▶</span>
          <span class="row-id">${p.id}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="row-meta">${doneCount}/${p.path.length} phòng xong</span>
        </div>
      </div>
      <div class="row-detail ${isOpen?'open':''}" data-id="${p.id}">
        ${p.path.map(s=>`
          <div class="detail-line">
            <span>${s.roomName} <span class="mono" style="color:var(--subtle);font-size:11px;">(${s.roomId})</span></span>
            ${statusChip(s.status)}
          </div>`).join("")}
      </div>
    `;
    list.appendChild(row);
  });
}

function renderRoomList(roomsState){
  const list = document.getElementById('roomList');
  const openIds = [...list.querySelectorAll('.row-detail.open')].map(el=>el.dataset.id);
  list.innerHTML = "";
  roomsState.forEach(r=>{
    const row = document.createElement('div');
    row.className = "row";
    const isOpen = openIds.includes(r.id);
    let statusChipHtml;
    if(!r.isOpen) statusChipHtml = '<span class="chip closed">Đóng cửa</span>';
    else if(r.overloaded) statusChipHtml = '<span class="chip over">Quá tải</span>';
    else statusChipHtml = '<span class="chip done">Ổn định</span>';

    const detailHtml = r.isOpen ? (()=>{
      const waitIds = getPatientIdsForRoom(r.id, STATUS.NONE);
      const progIds = getPatientIdsForRoom(r.id, STATUS.PROG);
      const tagList = (ids, cls) => ids.length
        ? `<div class="id-tags">${ids.map(id=>`<span class="id-tag ${cls}">${id}</span>`).join("")}</div>`
        : `<div class="id-empty">Không có</div>`;
      return `
        <div class="detail-stat-row">
          <div class="detail-stat">Số BN khám cùng lúc<b class="mono">${r.slots}</b></div>
          <div class="detail-stat">Đang chờ<b class="mono">${r.waiting}</b></div>
          <div class="detail-stat">Ngưỡng quá tải<b class="mono">> ${r.slots * (r.slots>=8?2:1)}</b></div>
          <div class="detail-stat">Trạng thái<b>${r.overloaded ? 'Quá tải' : 'Bình thường'}</b></div>
        </div>
        <div class="id-group">
          <div class="id-group-label">ID đang chờ (${waitIds.length})</div>
          ${tagList(waitIds, "")}
        </div>
        <div class="id-group">
          <div class="id-group-label">ID đang khám (${progIds.length})</div>
          ${tagList(progIds, "prog")}
        </div>`;
    })() : `
        <div class="detail-line" style="border-bottom:none;">
          <span>Phòng tạm đóng ngoài giờ thấp điểm — mở lại khi nhu cầu tăng.</span>
        </div>`;

    row.innerHTML = `
      <div class="row-head ${isOpen?'expanded':''}" onclick="toggleRow(this)">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="caret">▶</span>
          <span class="row-id">${r.id}</span>
          <span class="row-meta">${r.name}</span>
        </div>
        <div>${statusChipHtml}</div>
      </div>
      <div class="row-detail ${isOpen?'open':''}" data-id="${r.id}">
        ${detailHtml}
      </div>
    `;
    list.appendChild(row);
  });
}

function toggleRow(headEl){
  const detail = headEl.nextElementSibling;
  const opening = !detail.classList.contains('open');
  detail.classList.toggle('open');
  headEl.classList.toggle('expanded');
  if(opening){
    setTimeout(()=> detail.scrollIntoView({behavior:'smooth', block:'nearest'}), 50);
  }
}

function tick(){
  simMinutes += 18;
  if(simMinutes > DAY_END) simMinutes = DAY_START + (simMinutes - DAY_END);
  const intensity = loadIntensity(simMinutes);
  currentIntensity = intensity;
  updateLoadBadge(intensity);

  const openRoomsNow = rooms.filter(r=> intensity >= r.minIntensity);

  const slotsById = {};
  rooms.forEach(r=> slotsById[r.id] = r.slots);
  const inProgressCount = {};
  patients.forEach(p=> p.path.forEach(s=>{
    if(s.status===STATUS.PROG) inProgressCount[s.roomId] = (inProgressCount[s.roomId]||0) + 1;
  }));

  patients = patients.map(p=>{
    const path = p.path.map(s=>{
      if(s.status===STATUS.PROG && Math.random()>0.6){
        inProgressCount[s.roomId] = (inProgressCount[s.roomId]||1) - 1;
        return {...s, status:STATUS.WAIT};
      }
      if(s.status===STATUS.WAIT && Math.random()>0.7) return {...s, status:STATUS.DONE};
      if(s.status===STATUS.NONE && Math.random()>0.6){
        const cap = slotsById[s.roomId] || 4;
        const cur = inProgressCount[s.roomId] || 0;
        if(cur < cap){
          inProgressCount[s.roomId] = cur + 1;
          return {...s, status:STATUS.PROG};
        }
        return s; // phòng đã kín chỗ, tiếp tục chờ
      }
      return s;
    });
    return {...p, path};
  });

  // Sinh bệnh nhân mới: tốc độ đến khám nhanh/chậm theo giờ cao/thấp điểm.
  const expectedArrivals = 0.3 + intensity*2.4;
  let arrivals = Math.floor(expectedArrivals);
  if(Math.random() < expectedArrivals - arrivals) arrivals++;
  for(let i=0;i<arrivals;i++){
    patients.unshift(createPatient(patientIdCounter++, true, openRoomsNow));
  }

  waitHistory.push(Math.max(3, waitHistory[waitHistory.length-1] + (Math.random()*6-3) + intensity*2));
  if(waitHistory.length>16) waitHistory.shift();
  secsSinceRefresh = 0;
  render();
}

currentIntensity = loadIntensity(simMinutes);
updateLoadBadge(currentIntensity);

setInterval(()=>{
  secsSinceRefresh++;
  document.getElementById('refreshSecs').textContent = secsSinceRefresh;
}, 1000);
setInterval(tick, 5000);

render();
</script>
